{% extends 'base.html' %}
{% block title %}Добавить еду — NutriTrack{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h3 class="fw-700 mb-4">
                    <i class="bi bi-plus-circle me-2" style="color:#667eea;"></i>
                    Добавить приём пищи
                </h3>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-600">Продукт</label>
                        {{ form.food_item }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-600">Приём пищи</label>
                        {{ form.meal_type }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-600">Количество (г)</label>
                        {{ form.amount }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-600">Дата</label>
                        {{ form.date }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-600">Заметки</label>
                        {{ form.notes }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            <i class="bi bi-check-lg me-2"></i>Добавить
                        </button>
                        <a href="{% url 'nutrition:dashboard' %}"
                           class="btn btn-outline-secondary">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
