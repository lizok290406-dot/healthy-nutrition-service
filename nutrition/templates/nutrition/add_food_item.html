{% extends 'base.html' %}
{% block title %}Добавить продукт — NutriTrack{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card p-4">
                <h3 class="fw-bold mb-1">
                    <i class="bi bi-plus-circle me-2"
                       style="color:#667eea;"></i>
                    Добавить свой продукт
                </h3>
                <p class="text-muted mb-4">
                    Укажи название и КБЖУ — продукт появится в каталоге
                </p>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            Название продукта
                        </label>
                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Например: Яблоко"
                               required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                Категория
                            </label>
                            <select name="category" class="form-select" required>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">
                                    {{ cat.emoji }} {{ cat.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                Калории (на 100г)
                            </label>
                            <input type="number"
                                   name="calories"
                                   class="form-control"
                                   placeholder="100"
                                   min="0"
                                   step="0.1"
                                   required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">
                                Белки (г)
                            </label>
                            <input type="number"
                                   name="protein"
                                   class="form-control"
                                   placeholder="0"
                                   min="0"
                                   step="0.1"
                                   value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">
                                Углеводы (г)
                            </label>
                            <input type="number"
                                   name="carbs"
                                   class="form-control"
                                   placeholder="0"
                                   min="0"
                                   step="0.1"
                                   value="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">
                                Жиры (г)
                            </label>
                            <input type="number"
                                   name="fat"
                                   class="form-control"
                                   placeholder="0"
                                   min="0"
                                   step="0.1"
                                   value="0">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                Эмодзи (необязательно)
                            </label>
                            <input type="text"
                                   name="emoji"
                                   class="form-control"
                                   placeholder="🍎"
                                   value="🍽️">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                Цена за 100г (₽, необязательно)
                            </label>
                            <input type="number"
                                   name="price_per_100g"
                                   class="form-control"
                                   placeholder="10.00"
                                   min="0"
                                   step="0.1">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit"
                                class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-2"></i>
                            Добавить продукт
                        </button>
                        <a href="{% url 'nutrition:food_catalog' %}"
                           class="btn btn-outline-secondary px-4">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
