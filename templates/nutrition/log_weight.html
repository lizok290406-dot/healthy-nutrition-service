{% extends 'base.html' %}
{% block title %}Записать вес — NutriTrack{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="fw-bold mb-4">
                    <i class="bi bi-rulers me-2" style="color:#667eea;"></i>
                    Записать вес
                </h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-bold">Вес (кг)</label>
                        <input type="number" name="weight" class="form-control"
                               step="0.1" min="20" max="300"
                               placeholder="например: 65" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            <i class="bi bi-check-lg me-2"></i>Сохранить
                        </button>
                        <a href="{% url 'nutrition:progress' %}"
                           class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
